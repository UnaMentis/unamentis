name: Setup Custom Domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Add solution-explorer.unamentis.org
    runs-on: ubuntu-latest
    steps:
      - name: Create CNAME DNS Record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Zone ID from Pages API response for unamentis.org
          ZONE_ID="8187e1e6b3b194f2ecc55ebc754389b8"

          echo "Creating CNAME: solution-explorer.unamentis.org -> um-solution-explorer.pages.dev"

          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "CNAME",
              "name": "solution-explorer",
              "content": "um-solution-explorer.pages.dev",
              "proxied": true
            }')

          echo "API Response:"
          echo "$RESULT" | python3 -m json.tool

          SUCCESS=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success', False))")
          if [ "$SUCCESS" = "True" ]; then
            echo ""
            echo "CNAME record created successfully!"
          else
            ERROR_MSG=$(echo "$RESULT" | python3 -c "import json,sys; errors=json.load(sys.stdin).get('errors',[]); print(errors[0].get('message','unknown') if errors else 'unknown')")
            echo ""
            echo "DNS creation result: $ERROR_MSG"
            echo "If this failed, add the CNAME manually in Cloudflare dashboard:"
            echo "  DNS > Records > Add CNAME: solution-explorer -> um-solution-explorer.pages.dev (proxied)"
          fi

      - name: Verify Domain Resolution
        run: |
          echo "Waiting 10 seconds for DNS propagation..."
          sleep 10
          echo "Testing resolution..."
          curl -sI --max-time 10 https://solution-explorer.unamentis.org 2>&1 | head -5 || echo "Domain not resolving yet (may need more time)"
