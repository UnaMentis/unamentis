name: Setup Custom Domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Add solution-explorer.unamentis.org
    runs-on: ubuntu-latest
    steps:
      - name: Add Custom Domain to Pages Project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Adding solution-explorer.unamentis.org to Pages project um-solution-explorer..."

          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/um-solution-explorer/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name": "solution-explorer.unamentis.org"}')

          echo "API Response:"
          echo "$RESULT" | python3 -m json.tool

          SUCCESS=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success', False))")
          if [ "$SUCCESS" = "True" ]; then
            echo ""
            echo "Custom domain added to Pages project successfully!"
            echo "Cloudflare will auto-provision the SSL certificate."
          else
            ERROR=$(echo "$RESULT" | python3 -c "import json,sys; errors=json.load(sys.stdin).get('errors',[]); print(errors[0].get('message','unknown') if errors else 'unknown')")
            if echo "$ERROR" | grep -qi "already"; then
              echo "Custom domain already exists on the project. All good!"
            else
              echo "::warning::Could not add domain automatically."
              echo "Manual steps needed in Cloudflare dashboard:"
              echo "1. DNS > Records > Add CNAME: solution-explorer -> um-solution-explorer.pages.dev (proxied)"
              echo "2. Pages > um-solution-explorer > Custom domains > Add: solution-explorer.unamentis.org"
            fi
          fi

      - name: Verify Current Domains
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Current domains on um-solution-explorer:"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/um-solution-explorer/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if data.get('success'):
              for d in data.get('result', []):
                  status = d.get('status', 'unknown')
                  name = d.get('name', 'unknown')
                  print(f'  - {name} ({status})')
          else:
              print('  Could not list domains')
              print(f'  Response: {json.dumps(data, indent=2)}')
          "
