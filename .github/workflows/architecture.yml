name: Architecture Visualization

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visualize:
    name: Generate & Deploy Architecture Viz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sirfifer/solution-explorer@main
        # Artifact upload may fail due to colons in generated filenames (e.g. detail-repo:unamentis.json)
        # which are invalid on Windows/NTFS. Cloudflare deployment completes before this step.
        # TODO: Report upstream to sirfifer/solution-explorer to sanitize artifact filenames
        continue-on-error: true
        with:
          config: solution-explorer.json
          deploy-to: cloudflare
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project-name: um-solution-explorer
