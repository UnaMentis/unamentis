name: Architecture Visualization

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visualize:
    name: Generate & Deploy Architecture Viz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sirfifer/solution-explorer@main  # main
        # continue-on-error is needed because the action's internal artifact upload uses
        # filenames with colons (e.g. detail-repo:unamentis.json), which are invalid on
        # Windows/NTFS and rejected by actions/upload-artifact@v4. The Cloudflare
        # deployment step inside the action completes before the artifact upload step,
        # so the deploy itself succeeds. The verification step below confirms this.
        # TODO: Report upstream to sirfifer/solution-explorer to sanitize artifact filenames.
        continue-on-error: true
        with:
          config: solution-explorer.json
          deploy-to: cloudflare
          cloudflare-api-token: ${{ secrets.UMSE_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project-name: um-solution-explorer

      - name: Verify Cloudflare deployment
        run: |
          echo "Verifying Cloudflare Pages deployment is reachable..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://um-solution-explorer.pages.dev || echo "000")
          if [ "$STATUS" = "000" ]; then
            echo "::error::Could not reach Cloudflare deployment (network error or timeout)"
            exit 1
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::Cloudflare deployment returned HTTP $STATUS"
            exit 1
          fi
          echo "Cloudflare deployment verified: HTTP $STATUS"
